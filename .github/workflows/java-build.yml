name: VINABACUS - Java Swing Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile Maven
        run: mvn -B --no-transfer-progress clean package
      - name: Kiem thu du lieu mau
        run: java -ea -Djava.awt.headless=true -cp target/test-classes:target/classes vn.vinabacus.KiemThuDuLieuMau
      - name: Kiem thu cay 6 thanh vien
        run: java -ea -Djava.awt.headless=true -cp target/test-classes:target/classes vn.vinabacus.KiemThuKhungSauNguoi
