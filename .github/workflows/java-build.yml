name: VINABACUS - Java Swing MVC
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and verify MVC
        run: mvn -B --no-transfer-progress clean verify
      - name: Verify Swing navigation
        run: xvfb-run -a java -ea -cp target/test-classes:target/classes vn.vinabacus.KiemThuDieuHuong
